spring.application.name=iam

# Datos de conexión (igual que antes)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/iam_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true


jwt.secret=${JWT_SECRET:cambia-esto-por-una-clave-local-de-al-menos-32-caracteres}
jwt.expiration=${JWT_EXPIRATION:3600000}