server:
  port: 3001

spring:
  application:
    name: ms-iam
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=sy-water-db;encrypt=true;trustServerCertificate=true
    username: security_app
    password: ${SECURITY_APP_PASSWORD}
    hikari:
      connection-test-query: SELECT 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: security
        use_nationalized_character_data: true
        type.preferred_instant_jdbc_type: TIMESTAMP
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  mail:                                    # Mailpit in development: http://localhost:8025
    host: localhost
    port: 1025
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

iam:
  internal:
    api-key: ${INTERNAL_API_KEY:}          # service-to-service key; the SAME value as "Internal:ApiKey" in the .NET services (empty = /internal/** refused)
  integration:
    devices-url: ${DEVICES_URL:http://localhost:3003}   # ms-device: HU-008 unlinks the devices of a deleted account (empty = only a log line)
  jwt:
    issuer: https://iam.cuidatuagua.local
    key-id: iam-key-1
    access-ttl: 1h
    refresh-ttl: 7d
    action-ttl: 5m
    public-key: file:./keys/public.pem
    private-key: file:./keys/private.pem
  codes:
    verification-ttl: 24h
    reset-ttl: 15m
    max-attempts: 5
    resend-cooldown: 60s
  lockout:
    max-attempts: 5
    duration: 15m
  avatars:
    storage-dir: ./uploads/avatars
    max-bytes: 2097152
  mail:
    from: "Cuida Tu Agua <no-reply@cuidatuagua.local>"
  cors-allowed-origins:
    - http://localhost:19006
    - http://localhost:8081

management:
  endpoints.web.exposure.include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.sywater.ms_iam: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
