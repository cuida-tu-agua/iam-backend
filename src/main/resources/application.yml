server:
  port: 3001

spring:
  application:
    name: ms-iam
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=sy-water-db;encrypt=true;trustServerCertificate=true
    username: security_app
    password: ${SECURITY_APP_PASSWORD}
    hikari:
      connection-test-query: SELECT 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: security
        use_nationalized_character_data: true
        type.preferred_instant_jdbc_type: TIMESTAMP
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  mail:                                    # Mailpit in development: http://localhost:8025
    host: localhost
    port: 1025
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

iam:
  internal:
    api-key: ${INTERNAL_API_KEY:}          # service-to-service key; the SAME value as "Internal:ApiKey" in the .NET services (empty = /internal/** refused)
  integration:
    devices-url: ${DEVICES_URL:http://localhost:3003}   # ms-device: HU-008 unlinks the devices of a deleted account (empty = only a log line); HU-062 metrics
    places-url: ${PLACES_URL:http://localhost:3002}     # ms-places: HU-062 metrics (empty = the places section is reported as unavailable)
    notifications-url: ${NOTIFICATIONS_URL:http://localhost:3006}   # ms-notification: HU-028 sends the phone verification code by SMS / WhatsApp (empty = phones cannot be verified, 503)
  jwt:
    issuer: https://iam.cuidatuagua.local
    key-id: iam-key-1
    access-ttl: 1h
    refresh-ttl: 7d
    action-ttl: 5m
    public-key: file:./keys/public.pem
    private-key: file:./keys/private.pem
  codes:
    verification-ttl: 24h
    reset-ttl: 15m
    max-attempts: 5
    resend-cooldown: 60s
    phone-ttl: 5m                          # HU-028 code that verifies the phone (SMS / WhatsApp)
  lockout:
    max-attempts: 5
    duration: 15m
  avatars:
    storage-dir: ./uploads/avatars
    max-bytes: 2097152
  mail:
    from: "Cuida Tu Agua <no-reply@cuidatuagua.local>"
    app-url: ${IAM_MAIL_APP_URL:http://localhost:8082}
  cors-allowed-origins:
    - http://localhost:19006
    - http://localhost:8081
  google:                                  # HU-004 "Continuar con Google" (empty id/secret = feature off, button hidden)
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/iam/api/auth/google/callback}   # through the gateway
    allowed-redirects: ${GOOGLE_ALLOWED_REDIRECTS:http://localhost:19006,http://localhost:8081,http://localhost:8082,saveyourwater:,exp:}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}      # true only where infra sets it (Docker)
    path: /v3/api-docs

openapi:
  server-url: ${IAM_OPENAPI_SERVER_URL:/}  # gateway prefix (/iam) so "Try it out" in Swagger UI works

management:
  endpoints.web.exposure.include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.sywater.ms_iam: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
